<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_fenomeno" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="30" fill="url(#bg_fenomeno)"/>
  
  <!-- Jersey with Popped Collar (Colletto Alzato alla Cantona) -->
  <path d="M40 200 Q40 148 100 148 Q160 148 160 200 Z" fill="#1e1b4b"/>
  <!-- Popped Collars -->
  <polygon points="76,145 84,122 96,148" fill="#e0e7ff"/>
  <polygon points="124,145 116,122 104,148" fill="#e0e7ff"/>
  <!-- Gold Chain -->
  <path d="M88 152 Q100 168 112 152" stroke="#eab308" stroke-width="2.5" fill="none"/>

  <!-- Neck -->
  <rect x="85" y="118" width="30" height="30" rx="4" fill="#d97706"/>

  <!-- Voluminous Curly / Afro Hair -->
  <!-- Bubbles representing tight curls -->
  <circle cx="70" cy="50" r="16" fill="#18181b"/>
  <circle cx="90" cy="40" r="18" fill="#18181b"/>
  <circle cx="110" cy="40" r="18" fill="#18181b"/>
  <circle cx="130" cy="50" r="16" fill="#18181b"/>
  <circle cx="62" cy="70" r="14" fill="#18181b"/>
  <circle cx="138" cy="70" r="14" fill="#18181b"/>
  <circle cx="100" cy="45" r="22" fill="#18181b"/>

  <!-- Head -->
  <path d="M68 76 Q68 132 100 132 Q132 132 132 76 Q132 50 100 50 Q68 50 68 76 Z" fill="#f59e0b"/>

  <!-- Sharp eyes & playful smile -->
  <circle cx="85" cy="80" r="4.5" fill="#18181b"/>
  <circle cx="86.5" cy="78.5" r="1.5" fill="#ffffff"/>
  <circle cx="115" cy="80" r="4.5" fill="#18181b"/>
  <circle cx="116.5" cy="78.5" r="1.5" fill="#ffffff"/>

  <!-- Wide Smug Grin with Teeth -->
  <path d="M86 106 Q100 124 114 106 Z" fill="#ffffff" stroke="#18181b" stroke-width="2"/>
</svg>
