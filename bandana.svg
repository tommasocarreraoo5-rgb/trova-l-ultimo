<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_bandana" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="30" fill="url(#bg_bandana)"/>
  
  <!-- Jersey -->
  <path d="M40 200 Q40 148 100 148 Q160 148 160 200 Z" fill="#0f172a"/>
  <circle cx="100" cy="180" r="10" fill="#f97316"/>
  <text x="100" y="184" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">7</text>

  <!-- Neck -->
  <rect x="85" y="118" width="30" height="30" rx="4" fill="#fdba74"/>

  <!-- Pirate Bandana (Bandana Calcetto) -->
  <path d="M60 68 Q100 38 140 68 L138 52 Q100 30 62 52 Z" fill="#dc2626"/>
  <!-- Bandana Knot hanging behind ear -->
  <polygon points="56,70 42,88 54,84" fill="#dc2626"/>
  <polygon points="54,72 40,95 48,90" fill="#b91c1c"/>
  <!-- White Polka Dots on Bandana -->
  <circle cx="75" cy="52" r="2.5" fill="#ffffff"/>
  <circle cx="95" cy="46" r="2.5" fill="#ffffff"/>
  <circle cx="115" cy="48" r="2.5" fill="#ffffff"/>
  <circle cx="130" cy="56" r="2.5" fill="#ffffff"/>
  <circle cx="85" cy="58" r="2.5" fill="#ffffff"/>
  <circle cx="105" cy="56" r="2.5" fill="#ffffff"/>

  <!-- Head -->
  <path d="M68 74 Q68 132 100 132 Q132 132 132 74 Q132 50 100 50 Q68 50 68 74 Z" fill="#fed7aa"/>

  <!-- Determined energetic eyes -->
  <circle cx="84" cy="80" r="4.5" fill="#0f172a"/>
  <circle cx="85.5" cy="78.5" r="1.5" fill="#ffffff"/>
  <circle cx="116" cy="80" r="4.5" fill="#0f172a"/>
  <circle cx="117.5" cy="78.5" r="1.5" fill="#ffffff"/>

  <!-- Nose -->
  <path d="M97 80 L95 95 L103 95" stroke="#ea580c" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Grin with tooth pick / determination -->
  <path d="M88 108 Q100 118 112 108" stroke="#0f172a" stroke-width="3" stroke-linecap="round" fill="none"/>
  <line x1="84" y1="109" x2="74" y2="105" stroke="#fef08a" stroke-width="2" stroke-linecap="round"/>
</svg>
