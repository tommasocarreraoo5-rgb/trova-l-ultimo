<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_portiere" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="skin_p" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="100%" stop-color="#fdba74"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="200" height="200" rx="30" fill="url(#bg_portiere)"/>
  
  <!-- Goalkeeper Jersey (Fluo Green / Black) -->
  <path d="M35 200 Q40 145 100 145 Q160 145 165 200 Z" fill="#84cc16"/>
  <path d="M50 160 L100 200 L150 160 Z" fill="#1e293b"/>
  <!-- Number 1 -->
  <circle cx="100" cy="180" r="12" fill="#000000"/>
  <text x="100" y="185" font-size="14" font-weight="900" fill="#84cc16" text-anchor="middle">1</text>

  <!-- Neck -->
  <rect x="85" y="120" width="30" height="30" rx="4" fill="#fba863"/>

  <!-- Head -->
  <path d="M66 76 Q66 136 100 136 Q134 136 134 76 Q134 46 100 46 Q66 46 66 76 Z" fill="url(#skin_p)"/>
  <circle cx="64" cy="88" r="8" fill="#fba863"/>
  <circle cx="136" cy="88" r="8" fill="#fba863"/>

  <!-- Backwards Baseball Cap (Benji Price Style) -->
  <path d="M60 62 Q100 32 140 62 Q130 42 100 40 Q70 42 60 62 Z" fill="#ef4444"/>
  <!-- Visor pointing backwards -->
  <path d="M125 45 Q155 35 158 50 Q145 55 130 52 Z" fill="#b91c1c"/>
  <!-- Cap front panel & logo -->
  <path d="M66 60 Q100 50 134 60 L132 72 Q100 62 68 72 Z" fill="#dc2626"/>
  <circle cx="100" cy="62" r="5" fill="#ffffff"/>
  <text x="100" y="64" font-size="6" font-weight="bold" fill="#dc2626" text-anchor="middle">GK</text>

  <!-- Eyes - Intense Focus -->
  <path d="M76 77 Q85 74 93 78" stroke="#0f172a" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M107 78 Q115 74 124 77" stroke="#0f172a" stroke-width="3" stroke-linecap="round" fill="none"/>
  <circle cx="85" cy="86" r="4.5" fill="#0f172a"/>
  <circle cx="86" cy="84.5" r="1.5" fill="#ffffff"/>
  <circle cx="115" cy="86" r="4.5" fill="#0f172a"/>
  <circle cx="116" cy="84.5" r="1.5" fill="#ffffff"/>

  <!-- Nasal Strip / Bandage on Nose (Cerotto sul naso da battaglia) -->
  <rect x="91" y="91" width="18" height="6" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="0.8" transform="rotate(-5 100 94)"/>

  <!-- Grin & Stubble -->
  <path d="M90 114 Q100 120 110 114" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  
  <!-- Goalkeeper Padded Gloves in foreground -->
  <path d="M22 170 Q30 145 45 155 Q40 185 22 170 Z" fill="#facc15" stroke="#000" stroke-width="2"/>
  <path d="M178 170 Q170 145 155 155 Q160 185 178 170 Z" fill="#facc15" stroke="#000" stroke-width="2"/>
</svg>
