<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_metronomo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="skin_m" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a16207"/>
      <stop offset="100%" stop-color="#713f12"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="200" height="200" rx="30" fill="url(#bg_metronomo)"/>
  
  <!-- Jersey (Emerald & White stripes) -->
  <path d="M40 200 Q40 148 100 148 Q160 148 160 200 Z" fill="#0f172a"/>
  <rect x="75" y="150" width="15" height="50" fill="#ffffff"/>
  <rect x="110" y="150" width="15" height="50" fill="#ffffff"/>

  <!-- Neck -->
  <rect x="85" y="118" width="30" height="35" rx="4" fill="#854d0e"/>

  <!-- Dreadlocks / Braids Hair tied up -->
  <path d="M60 70 Q55 25 100 25 Q145 25 140 70 Z" fill="#171717"/>
  <circle cx="100" cy="22" r="14" fill="#171717"/>
  <!-- Dreads falling on sides -->
  <path d="M58 65 Q50 90 54 115" stroke="#171717" stroke-width="6" stroke-linecap="round" fill="none"/>
  <path d="M142 65 Q150 90 146 115" stroke="#171717" stroke-width="6" stroke-linecap="round" fill="none"/>

  <!-- Head -->
  <path d="M66 74 Q66 134 100 134 Q134 134 134 74 Q134 46 100 46 Q66 46 66 74 Z" fill="url(#skin_m)"/>

  <!-- White Sweatband (Fascia tergisudore) -->
  <rect x="65" y="55" width="70" height="12" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Iconic Edgar Davids Sport Goggles (Occhialini Arancioni) -->
  <!-- Strap around head -->
  <path d="M64 78 L136 78" stroke="#000000" stroke-width="4"/>
  <!-- Goggle Frames -->
  <rect x="73" y="72" width="24" height="16" rx="6" fill="#f97316" stroke="#000000" stroke-width="2.5" opacity="0.95"/>
  <rect x="103" y="72" width="24" height="16" rx="6" fill="#f97316" stroke="#000000" stroke-width="2.5" opacity="0.95"/>
  <rect x="95" y="78" width="10" height="4" fill="#000000"/>
  <!-- Eye glint behind goggles -->
  <circle cx="85" cy="80" r="3.5" fill="#ffffff" opacity="0.8"/>
  <circle cx="115" cy="80" r="3.5" fill="#ffffff" opacity="0.8"/>

  <!-- Nose -->
  <path d="M96 98 Q100 102 104 98" stroke="#542e0c" stroke-width="2" fill="none"/>

  <!-- Confident Grin -->
  <path d="M88 112 Q100 120 112 112" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" fill="none"/>
</svg>
