<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_bomber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="skin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fba863"/>
    </linearGradient>
    <linearGradient id="jersey" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="200" height="200" rx="30" fill="url(#bg_bomber)"/>
  <circle cx="100" cy="100" r="85" fill="#1e293b" opacity="0.3"/>
  
  <!-- Jersey -->
  <path d="M40 200 Q40 150 100 150 Q160 150 160 200 Z" fill="url(#jersey)"/>
  <path d="M75 150 L100 175 L125 150 Z" fill="#ffffff" opacity="0.8"/>
  <circle cx="135" cy="175" r="7" fill="#fbbf24"/>
  <text x="135" y="178" font-size="8" font-weight="bold" fill="#000" text-anchor="middle">9</text>

  <!-- Neck -->
  <rect x="85" y="120" width="30" height="35" rx="5" fill="#fba863"/>
  
  <!-- Head & Face -->
  <path d="M65 75 Q65 135 100 135 Q135 135 135 75 Q135 45 100 45 Q65 45 65 75 Z" fill="url(#skin)"/>
  
  <!-- Ears -->
  <circle cx="63" cy="85" r="9" fill="#fba863"/>
  <circle cx="137" cy="85" r="9" fill="#fba863"/>
  <!-- Diamond Earring -->
  <polygon points="61,92 63,95 61,98 59,95" fill="#ffffff"/>

  <!-- Eyes & Eyebrows -->
  <path d="M75 70 Q85 67 93 72" stroke="#1f2937" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <path d="M107 72 Q115 67 125 70" stroke="#1f2937" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <circle cx="84" cy="82" r="4.5" fill="#1f2937"/>
  <circle cx="85.5" cy="80.5" r="1.5" fill="#ffffff"/>
  <circle cx="116" cy="82" r="4.5" fill="#1f2937"/>
  <circle cx="117.5" cy="80.5" r="1.5" fill="#ffffff"/>

  <!-- Nose -->
  <path d="M100 78 L97 96 L104 96" stroke="#ea580c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Smirk Mouth -->
  <path d="M88 110 Q100 120 114 110" stroke="#991b1b" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M92 110 Q100 115 110 110" fill="#ffffff"/>

  <!-- Goatee / Stylish Stubble -->
  <path d="M92 104 Q100 106 108 104" stroke="#374151" stroke-width="1.5" stroke-dasharray="2,1" fill="none"/>
  <path d="M93 118 Q100 130 107 118 Z" fill="#1f2937"/>

  <!-- Hair & Iconic Sports Headband (Cerchietto) -->
  <!-- Longish Top Hair pulled back -->
  <path d="M62 65 Q60 30 100 28 Q140 30 138 65 Q135 40 100 38 Q65 40 62 65 Z" fill="#1f2937"/>
  <!-- The Black Cerchietto / Elastic Headband -->
  <path d="M62 62 Q100 50 138 62" stroke="#000000" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M62 62 Q100 50 138 62" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" fill="none"/>
  
  <!-- Hair tuft falling slightly -->
  <path d="M90 48 Q95 38 105 44" stroke="#1f2937" stroke-width="4" stroke-linecap="round" fill="none"/>
</svg>
